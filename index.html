<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Clic Redes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --fundo:#f4f6f8; --cartao:#ffffff; --texto:#14212b; --suave:#5b6b78;
    --borda:#dde3e8; --marca:#0f766e; --marca-escura:#0b5c56; --erro:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:var(--fundo);color:var(--texto);font-family:Inter,system-ui,sans-serif;padding:24px 16px}
  .cartao{width:100%;max-width:380px;background:var(--cartao);border:1px solid var(--borda);
          border-radius:14px;padding:32px 28px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;margin-bottom:6px}
  .logo span{width:34px;height:34px;border-radius:9px;background:var(--marca);color:#fff;
             display:grid;place-items:center;font-size:17px}
  p.sub{margin:0 0 24px;color:var(--suave);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:9px;font:inherit;font-size:15px}
  input:focus{outline:2px solid var(--marca);outline-offset:-1px;border-color:transparent}
  button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:var(--marca);
         color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  button:hover{background:var(--marca-escura)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;font-size:14px;color:var(--erro);min-height:20px}
  footer{margin-top:20px;font-size:12px;color:var(--suave);text-align:center;line-height:1.8}
  footer a{color:var(--suave)}
  .sobre{width:100%;max-width:380px;margin-top:18px;font-size:13.5px;color:var(--suave);line-height:1.55;text-align:center}
  .redes{display:flex;justify-content:center;gap:8px;margin:10px 0 0}
  .rede-ic{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:14px;color:#fff}
  .rede-ic.instagram{background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888)}
  .rede-ic.facebook{background:#1877f2}
  .rede-ic.youtube{background:#ff0000}
</style>
</head>
<body>
  <main class="cartao">
    <div class="logo"><span>C</span>Clic Redes</div>
    <p class="sub">Entre para agendar e acompanhar suas redes.</p>
    <form id="form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </main>
  <section class="sobre">
    O Clic Redes agenda publicações, mostra métricas e reúne mensagens e comentários das contas que você conecta.
    <div class="redes" aria-label="Redes compatíveis">
      <span class="rede-ic instagram" title="Instagram"><i class="fa-brands fa-instagram"></i></span>
      <span class="rede-ic facebook" title="Facebook"><i class="fa-brands fa-facebook-f"></i></span>
      <span class="rede-ic youtube" title="YouTube"><i class="fa-brands fa-youtube"></i></span>
    </div>
    <div style="margin-top:6px">Compatível com Instagram, Facebook e YouTube.</div>
  </section>
  <footer>
    <a href="privacidade.html">Política de privacidade</a> · <a href="termos.html">Termos de uso</a><br>
    Clic Redes · index.html v1.1
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Dados publicos do projeto (a chave publishable pode ficar no site)
  const SUPABASE_URL = "https://ochesgabptfapmogxmvv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_J06qsVfOBpm4LdMu-hmkiQ_LO7TIyfE";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Se ja estiver logado, vai direto
  sb.auth.getSession().then(({ data }) => {
    if (data.session) location.href = "contas.html";
  });

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");
    msg.textContent = "";
    btn.disabled = true; btn.textContent = "Entrando...";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("senha").value,
    });
    if (error) {
      msg.textContent = "E-mail ou senha incorretos.";
      btn.disabled = false; btn.textContent = "Entrar";
      return;
    }
    location.href = "contas.html";
  });
</script>
</body>
</html>
